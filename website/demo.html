<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quartz — Try the Editor</title>
    <meta name="description" content="Try the Quartz markdown editor in your browser" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        -webkit-font-smoothing: antialiased;
      }

      .editor-frame {
        width: 100%;
        height: 100vh;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe src="demo/index.html" class="editor-frame" title="Quartz Editor"></iframe>
  </body>
</html>
